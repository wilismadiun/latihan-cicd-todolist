version: 0.2

env:
  variables:
    GOOS: darwin
    GOARCH: amd64

phases:
  install:
    runtime-versions:
      go: 1.23
    commands:
      - echo "hello from install"
  
  pre_build:
    commands:
      - echo "hello from pre_build"
  
  build:
    commands:
      - mv main.go main.go.tmp
      - envsubst < "main.go.tmp" > "main.go"
      - go build main.go
  
  post_build:
    commands:
      - echo "hello from post_build"

# reports:
#
# cache:

artifacts:
  files:
    - 'hello-world'
    - 'README.txt'
  name: hello-app-$(date +%Y-%m-%d).zip